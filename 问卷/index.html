<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>找到你擅长且喜欢的事情</title>
<style>
  :root{--ink:#1c1a17;--sub:#6b655c;--line:#e8e0d4;--paper:#fbf8f2;--accent:#b8552f;--ok:#2f5d50}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#efece6;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden}
  .phone{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
  header{padding:18px 22px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
  .bar{height:4px;background:#f0e9de;border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  .hint{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
  main{flex:1;padding:26px 22px 120px}
  .qno{font-size:12px;letter-spacing:.2em;color:var(--accent);margin-bottom:10px}
  .stem{font-size:20px;font-weight:700;line-height:1.55;margin-bottom:6px}
  .sub{font-size:13px;color:var(--sub);margin-bottom:20px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;
       padding:14px 16px;margin-bottom:10px;font-size:15px;color:var(--ink);cursor:pointer;transition:.15s;font-family:inherit}
  .opt:hover{border-color:#c9bda9}
  .opt.sel{border-color:var(--accent);background:#fdf6f1;box-shadow:0 0 0 1px var(--accent) inset}
  .opt .k{display:inline-block;width:22px;color:var(--accent);font-weight:700}
  .likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .likert button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px 4px;font-size:13px;
       color:var(--sub);cursor:pointer;font-family:inherit}
  .likert button.sel{border-color:var(--accent);background:#fdf6f1;color:var(--accent);font-weight:700}
  .rank .item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .rank .item .num{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
  .rank .item.sel{border-color:var(--accent);background:#fdf6f1}
  .rank .item.sel .num{background:var(--accent);color:#fff;border-color:var(--accent)}
  .multi .opt.sel .k{color:var(--ok)}
  .ghead{font-size:12px;color:var(--sub);margin:16px 0 8px;letter-spacing:.08em}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip2{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit}
  .chip2.sel{border-color:var(--accent);background:#fdf6f1;color:var(--accent)}
  textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;
       font-family:inherit;resize:vertical;line-height:1.6}
  .count{text-align:right;font-size:12px;color:var(--sub);margin-top:6px}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 22px;
       display:flex;gap:10px;max-width:480px;margin:0 auto}
  footer button{flex:1;border-radius:12px;padding:14px;font-size:16px;font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  footer button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  footer button:disabled{opacity:.4;cursor:not-allowed}
  .cover{padding:0}
  .cover .k{font-size:11px;letter-spacing:.3em;color:#b06a45;margin-bottom:16px}
  .cover h1{font-size:34px;line-height:1.3;margin-bottom:12px;letter-spacing:-.6px;font-weight:800}
  .cover p{color:#7a6a5c;font-size:15px;margin-bottom:6px}
  .cover .meta{font-size:12px;color:#9a8a7a;margin:18px 0 0}
  .cover button{width:100%;margin-top:14px}
  /* —— 新封面 —— */
  .hero{position:relative;overflow:hidden;min-height:100vh;width:100%;
        background:linear-gradient(165deg,#fffaf4 0%,#fbe9d8 52%,#f5d9c4 100%)}
  .hero .inner{position:relative;margin:0 auto;padding:52px 22px 48px;
        width:100%;max-width:430px;min-height:100vh;box-sizing:border-box;
        display:flex;flex-direction:column;justify-content:center}
  .hero .orb{max-width:none}
  .hero .orb{position:absolute;border-radius:50%;pointer-events:none}
  .hero .o1{width:190px;height:190px;background:radial-gradient(circle at 30% 30%,#f3c9a6,#eebd95);top:-70px;right:-60px;opacity:.55}
  .hero .o2{width:130px;height:130px;background:radial-gradient(circle at 40% 40%,#e8b48f,#e0a37c);bottom:-45px;left:-45px;opacity:.35}
  .hero .o3{width:60px;height:60px;background:#fff;opacity:.5;top:120px;right:28px}
  .hero .k{position:relative;font-size:11px;letter-spacing:.28em;color:#a85f3c;font-weight:700}
  .hero h1{position:relative;font-size:38px;line-height:1.26;letter-spacing:-1px;margin:16px 0 12px;font-weight:800}
  .hero h1 em{font-style:normal;color:#b8552f;box-shadow:inset 0 -12px 0 rgba(240,190,150,.45)}
  .hero .lead{position:relative;font-size:15px;color:#6f6053;line-height:1.7}
  .feat{position:relative;display:block;margin:24px 0 18px;width:100%}
  .feat .row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.78);
             border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:12px 14px;width:100%;
             margin-bottom:10px;box-sizing:border-box;box-shadow:0 6px 18px rgba(180,120,80,.08)}
  .feat .ic{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;
            justify-content:center;font-size:12px;font-weight:800;color:#b8552f;flex:none;
            box-shadow:0 2px 6px rgba(180,120,80,.12);letter-spacing:.5px}
  .feat b{display:block;font-size:15px;color:#2b2723}
  .feat span{display:block;font-size:12px;color:#8a7868;margin-top:1px}
  .hero .cta{position:relative;width:100%;border:none;border-radius:14px;padding:16px;
             background:linear-gradient(135deg,#c05f36,#a94e2a);color:#fff;font-size:17px;font-weight:800;
             font-family:inherit;letter-spacing:.5px;box-shadow:0 10px 24px rgba(169,78,42,.28);cursor:pointer}
  .hero .cta small{display:block;font-size:11px;font-weight:400;opacity:.85;letter-spacing:0;margin-top:2px}
  .hero .alt{position:relative;width:100%;background:none;border:none;color:#8a7868;font-size:13px;
             text-decoration:underline;margin-top:14px;font-family:inherit;cursor:pointer}
  .trustline{position:relative;font-size:11px;color:#9a8a7a;text-align:center;margin-top:16px;line-height:1.6}
  .ghost{background:#fff;color:var(--sub);border:1px dashed var(--line)}
  pre{background:#f7f4ee;border-radius:12px;padding:14px;font-size:11px;line-height:1.5;overflow:auto;max-height:300px;
      white-space:pre-wrap;word-break:break-all;font-family:Consolas,monospace}
  .done h2{font-size:24px;margin-bottom:8px}
  .done p{color:var(--sub);font-size:14px;margin-bottom:14px}
  .done .row{display:flex;gap:10px;margin:14px 0}
  .done .row button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <header id="hdr" style="display:none">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--sub)">
      <span>擅长且喜欢</span><span id="pos">1 / 45</span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="hint"><span id="mod">才能</span><span id="tip">约 9 分钟</span></div>
  </header>

  <main id="main"></main>
  <footer id="ftr" style="display:none">
    <button id="prev">上一题</button>
    <button id="next" class="primary">下一题</button>
  </footer>
</div>

<script>
const DATA = {"questions": [{"id": "P0", "module": "profile", "type": "tel", "stem": "你的手机号（用于交付报告，不会外传）", "required": true}, {"id": "P1", "module": "profile", "type": "choice", "tag": "age", "stem": "你今年多大？", "options": [{"key": "A", "text": "18–22 岁"}, {"key": "B", "text": "23–27 岁"}, {"key": "C", "text": "28–34 岁"}, {"key": "D", "text": "35–44 岁"}, {"key": "E", "text": "45 岁以上"}]}, {"id": "P2", "module": "profile", "type": "choice", "tag": "stage", "stem": "你现在的状态是：", "options": [{"key": "A", "text": "在校 / 刚毕业，在找工作"}, {"key": "B", "text": "工作 1–3 年"}, {"key": "C", "text": "工作 3–8 年"}, {"key": "D", "text": "工作 8 年以上"}, {"key": "E", "text": "自由职业 / 自己做事"}, {"key": "F", "text": "全职照顾家庭 / 待业中"}]}, {"id": "P3", "module": "profile", "type": "choice", "tag": "goal", "stem": "你现在最想解决的是：", "options": [{"key": "A", "text": "不知道能做什么"}, {"key": "B", "text": "想转行，但不敢动"}, {"key": "C", "text": "想涨薪 / 升职"}, {"key": "D", "text": "想搞副业 / 第二曲线"}, {"key": "E", "text": "想创业，做自己的事"}]}, {"id": "P6", "module": "profile", "type": "choice", "stem": "你填的生日是阳历还是阴历？（不知道就选阳历）", "options": [{"key": "A", "text": "阳历（公历）—— 身份证上那个，如 1984-11-16"}, {"key": "B", "text": "阴历（农历）—— 老家过生日那个，如 1984-10-24"}]}, {"id": "P4", "module": "profile", "type": "date", "stem": "你的出生年月日？（按上一题选的历法填）"}, {"id": "P5", "module": "profile", "type": "choice", "stem": "你出生在哪个时辰？（不知道就选最接近的）", "options": [{"key": "A", "text": "子时（23–1 点）"}, {"key": "B", "text": "丑时（1–3 点）"}, {"key": "C", "text": "寅时（3–5 点）"}, {"key": "D", "text": "卯时（5–7 点）"}, {"key": "E", "text": "辰时（7–9 点）"}, {"key": "F", "text": "巳时（9–11 点）"}, {"key": "G", "text": "午时（11–13 点）"}, {"key": "H", "text": "未时（13–15 点）"}, {"key": "I", "text": "申时（15–17 点）"}, {"key": "J", "text": "酉时（17–19 点）"}, {"key": "K", "text": "戌时（19–21 点）"}, {"key": "L", "text": "亥时（21–23 点）"}]}, {"id": "Q1", "module": "talent", "type": "choice", "stem": "周五下午，老板丢来一个没头没尾的需求，说下周一要。你的第一反应是：", "options": [{"key": "A", "text": "先问清楚：到底要解决什么问题、谁在用", "scores": {"thinking": 2}}, {"key": "B", "text": "先拆开：哪些能先做、哪些要等", "scores": {"executing": 2}}, {"key": "C", "text": "先想：有没有更聪明的做法", "scores": {"creating": 2}}, {"key": "D", "text": "先找人：看看别人有没有现成的", "scores": {"connecting": 2}}]}, {"id": "Q2", "module": "talent", "type": "choice", "stem": "项目复盘会上，大家各说各的。你通常会：", "options": [{"key": "A", "text": "把大家的发言整理成几条主线", "scores": {"thinking": 2}}, {"key": "B", "text": "直接说：下次就改这三件事", "scores": {"executing": 2}}, {"key": "C", "text": "提一个大家没想到的角度", "scores": {"creating": 2}}, {"key": "D", "text": "先肯定每个人的贡献", "scores": {"connecting": 2}}]}, {"id": "Q3", "module": "talent", "type": "choice", "stem": "要学一个完全陌生的东西，你会：", "options": [{"key": "A", "text": "找一门课，从第一章系统学起", "scores": {"stabilizing": 2}}, {"key": "B", "text": "先动手做个小 demo，边做边查", "scores": {"exploring": 2}}, {"key": "C", "text": "找行业里的人聊，问他们怎么理解", "scores": {"connecting": 2}}, {"key": "D", "text": "先把概念和框架画出来", "scores": {"thinking": 2}}]}, {"id": "Q4", "module": "talent", "type": "choice", "stem": "一群人要在七天里搞定一件从没做过的事，你最可能：", "options": [{"key": "A", "text": "站出来分工、定节点", "scores": {"executing": 2}}, {"key": "B", "text": "提出一个完全不同的方案", "scores": {"creating": 2}}, {"key": "C", "text": "先去试做最小的一块", "scores": {"exploring": 2}}, {"key": "D", "text": "把风险列清楚，先定底线", "scores": {"stabilizing": 2}}]}, {"id": "Q5", "module": "talent", "type": "choice", "stem": "一件做了很久的事，突然看不到进展。你会：", "options": [{"key": "A", "text": "换个方法再试", "scores": {"creating": 2}}, {"key": "B", "text": "拆成更小的步骤，每天推一点", "scores": {"executing": 2}}, {"key": "C", "text": "接受它需要时间，继续熬", "scores": {"stabilizing": 2}}, {"key": "D", "text": "先去试试别的方向", "scores": {"exploring": 2}}]}, {"id": "Q6", "module": "talent", "type": "choice", "stem": "别人形容你，最常说的一句是：", "options": [{"key": "A", "text": "交给你我放心", "scores": {"stabilizing": 2}}, {"key": "B", "text": "你好奇心真强", "scores": {"exploring": 2}}, {"key": "C", "text": "跟你聊天很舒服", "scores": {"connecting": 2}}, {"key": "D", "text": "你想得真细", "scores": {"thinking": 2}}]}, {"id": "Q7", "module": "talent", "type": "likert"       h += `<div class="item${pos>=0?' sel':''}" data-k="${esc(it.key)}"><span class="num">${pos>=0?pos+1:''}</span>${esc(it.text)}</div>`;
    });
    h += `</div><button class="opt ghost" id="resetRank" style="margin-top:4px;width:auto;padding:8px 16px;display:inline-block;font-size:13px">重排</button>`;
  }
  else if(q.type === 'multi'){
    const chosen = state.answers[q.id] || [];
    h += `<div class="sub">已选 ${chosen.length} / ${q.max_pick||3}</div>`;
    if(q.grouped){
      (DATA.groups||[]).forEach(g=>{
        const items = opts.filter(o=>o.group===g.id);
        if(!items.length) return;
        h += `<div class="ghead">${esc(g.name)}</div><div class="chips">`;
        items.forEach(o=>{
          const on = chosen.includes(o.key);
          h += `<button class="chip2${on?' sel':''}" data-k="${esc(o.key)}">${on?'✓ ':''}${esc(o.text)}</button>`;
        });
        h += '</div>';
      });
    }else{
      h += '<div class="multi">';
      opts.forEach(o=>{
        const sel = chosen.includes(o.key) ? ' sel' : '';
        h += `<button class="opt${sel}" data-k="${esc(o.key)}"><span class="k">${chosen.includes(o.key)?'✓':'○'}</span>${esc(o.text)}</button>`;
      });
      h += '</div>';
    }
  }
  else if(q.type === 'date'){
    const val = state.answers[q.id] || '';
    const lunar = state.answers['P6'] === 'B';
    const calName = lunar ? '阴历（农历）' : '阳历（公历）';
    const demo = lunar ? '1984-10-24' : '1984-11-16';
    h += `<input type="text" id="dateIn" inputmode="numeric" maxlength="10" value="${esc(val)}"
            placeholder="例如 ${demo}"
            style="width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:20px;letter-spacing:2px;font-family:inherit">
          <div class="sub" style="margin-top:10px">你上一题选的是<b>${calName}</b>，请按${lunar ? '农历' : '公历'}的年月日填。</div>
          <div class="sub" style="margin-top:6px;color:#b08968">直接打数字就行，横杠会自动补上。${lunar ? '系统会自动帮你换算成公历。' : '就是身份证上的那个日期。'}</div>`;
  }
  else if(q.type === 'email'){
    const val = state.answers[q.id] || '';
    h += `<input type="email" id="mailIn" value="${esc(val)}" placeholder="name@example.com"
            style="width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;font-family:inherit">
          <div class="sub" style="margin-top:10px">填了的话，报告生成后直接发你邮箱，你可以先关掉页面。不填也行，点下面「下一题」跳过。</div>`;
  }
  else if(q.type === 'tel'){
    const val = state.answers[q.id] || '';
    h += `<input type="tel" id="telIn" inputmode="numeric" maxlength="11" value="${esc(val)}"
            placeholder="11 位手机号"
            style="width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px;letter-spacing:1px;font-family:inherit">
          <div class="sub" style="margin-top:10px">只用于交付报告，不会外传</div>`;
  }
  else if(q.type === 'open'){
    const val = state.answers[q.id] || '';
    h += `<textarea maxlength="${q.max_chars||200}" placeholder="写具体一点，报告会引用你自己的话">${esc(val)}</textarea>
          <div class="count"><span id="cc">${val.length}</span> / ${q.max_chars||200}</div>`;
  }

  $('#main').innerHTML = h;
  $('#prev').disabled = state.idx === 0;
  $('#next').textContent = state.idx === DATA.questions.length-1 ? '提交' : '下一题';

  bind(q);
}

function dynOptions(q){
  const F = DATA.fields || [];
  const pick = (ids) => F.filter(f => ids.includes(f.id));
  const fmt = list => list.map(f => ({key: f.id, text: f.name, group: f.group}));
  if(q.dynamic === 'all_fields') return fmt(F);
  if(q.dynamic === 'picked20')  return fmt(pick(state.answers['Q31'] || []));
  if(q.dynamic === 'picked10')  return fmt(pick(state.answers['Q32'] || []));
  if(q.dynamic === 'picked5')   return fmt(pick(state.answers['Q33'] || []));
  if(q.dynamic === 'subs' || q.dynamic === 'subs2'){
    const ids = state.answers['Q34'] || [];
    const idx = q.dynamic === 'subs2' ? 1 : 0;
    const f = F.find(x => x.id === ids[idx]);
    const subs = (f && f.subs) || [];
    return subs.map((s, i) => ({key: String(i), text: s}));
  }
  return q.options || [];
}

function bind(q){  if(q.type === 'choice'){
    $('#main').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      state.answers[q.id] = b.dataset.k; save(); render();
    });
  }
  if(q.type === 'likert' || q.type === 'check_likert'){
    $('#main').querySelectorAll('.likert button').forEach(b=>b.onclick=()=>{
      state.answers[q.id] = Number(b.dataset.v); save(); render();
    });
  }
  if(q.type === 'ranking'){
    $('#main').querySelectorAll('.rank .item').forEach(el=>el.onclick=()=>{
      let order = state.answers[q.id] || [];
      const k = el.dataset.k;
      if(order.includes(k)) order = order.filter(x=>x!==k);
      else order = [...order, k];
      state.answers[q.id] = order; save(); render();
    });
    const r = $('#resetRank'); if(r) r.onclick=()=>{ state.answers[q.id]=[]; save(); render(); };
  }
  if(q.type === 'multi'){
    $('#main').querySelectorAll('.opt, .chip2').forEach(b=>b.onclick=()=>{
      let arr = state.answers[q.id] || [];
      const k = b.dataset.k;
      if(arr.includes(k)) arr = arr.filter(x=>x!==k);
      else { if(arr.length >= (q.max_pick||3)) return; arr = [...arr, k]; }
      state.answers[q.id] = arr; save(); render();
    });
  }
  if(q.type === 'open'){
    const ta = $('#main').querySelector('textarea');
    ta.oninput = ()=>{ state.answers[q.id] = ta.value; $('#cc').textContent = ta.value.length; save(); };
  }
  if(q.type === 'date'){
    const el = $('#dateIn');
    el.oninput = ()=>{
      let v = el.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 6) v = v.slice(0,4) + '-' + v.slice(4,6) + '-' + v.slice(6);
      else if (v.length > 4) v = v.slice(0,4) + '-' + v.slice(4);
      el.value = v; state.answers[q.id] = v; save();
    };
  }
  if(q.type === 'tel'){
    const el = $('#telIn');
    el.oninput = ()=>{
      const v = el.value.replace(/\D/g, '').slice(0, 11);
      el.value = v; state.answers[q.id] = v; save();
    };
  }
  if(q.type === 'email'){
    const el = $('#mailIn');
    el.oninput = ()=>{ state.answers[q.id] = el.value.trim(); save(); };
  }
}

function done(){
  $('#hdr').style.display='none'; $('#ftr').style.display='none';
  const json = JSON.stringify(state.answers, null, 2);
  const phone = state.answers['P0'] || '';
  $('#main').innerHTML = `<div class="done">
    <h2>答完了</h2>
    <p id="subStatus">正在提交…</p>
    <div class="row" style="display:none" id="fallback">
      <button id="dl">下载 answers.json</button><button id="cp">复制答案</button>
    </div>
    <pre id="out" style="display:none">${esc(json)}</pre>
    <div class="row"><button id="again">重新开始</button></div>
  </div>`;
  $('#dl').onclick = ()=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
    a.download = 'answers.json'; a.click();
  };
  $('#cp').onclick = ()=>{ navigator.clipboard.writeText(json); $('#cp').textContent='已复制'; };
  $('#again').onclick = ()=>{ state.answers={}; state.idx=0; save(); $('#hdr').style.display='block'; $('#ftr').style.display='flex'; render(); };

  const st = $('#subStatus');
  const send = (phoneNo, email) => {
    state.answers['P0'] = phoneNo;
    if (email) state.answers['P7'] = email;
    const sid = (function(){
      let s = localStorage.getItem('lt_sid');
      if (!s) { s = 's' + Date.now() + Math.random().toString(36).slice(2, 8); localStorage.setItem('lt_sid', s); }
      return s;
    })();
    // 先落到本地：就算这一秒退出，下次打开也会自动补交
    try {
      localStorage.setItem('lt_pending', JSON.stringify({
        phone: phoneNo, email: email || '', answers: state.answers, sid: sid, ts: Date.now()
      }));
    } catch (e) {}

    st.innerHTML = '正在提交，请稍等 2–3 秒…<div style="font-size:13px;color:var(--sub);margin-top:6px">（提交中，稍等出现编号再退出）</div>';

    const body = JSON.stringify({phone: phoneNo, email: email || '', sid: sid, answers: state.answers});
    const attempt = (triesLeft) => {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 15000);
      fetch('/api/submit', {method:'POST', headers:{'Content-Type':'application/json'},
        keepalive: true, body: body, signal: ctrl.signal})
        .then(r => { clearTimeout(to); return r.json(); })
        .then(j => {
          if (!j.ok) throw new Error(j.error || 'bad');
          localStorage.removeItem('lt_pending');
          localStorage.removeItem('lt_sid');
          st.innerHTML = `已提交（编号 <b>${j.id}</b>）。正在生成你的报告，大约 1 分钟…`;
          let n = 0;
          const timer = setInterval(() => {
            n++;
            fetch('/api/status?id=' + encodeURIComponent(j.id)).then(r => r.json()).then(s => {
              if (s.ready) {
                clearInterval(timer);
                st.innerHTML = `<b>你的报告出来了</b>
                  <div style="font-size:13px;color:var(--sub);margin:4px 0 10px">长按图片可保存；要看高清版用下面的链接</div>
                  <img src="${s.mobile || s.png}" alt="报告" style="width:100%;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.12)">
                  <div style="margin-top:12px;font-size:14px">
                    <a href="${s.pdf}" target="_blank" style="color:var(--accent);font-weight:700">下载 PDF（高清）</a>
                    <span style="color:var(--sub)">　·　</span>
                    <a href="${s.png}" target="_blank" style="color:var(--accent)">高清长图</a>
                  </div>
                  <div style="font-size:13px;color:var(--sub);margin-top:8px">顾问会在 24 小时内联系你，附 15 分钟语音解读。</div>`;
              } else if (n > 90) {
                clearInterval(timer);
                st.textContent = '生成时间有点长，顾问会手动发给你。';
              }
            }).catch(()=>{});
          }, 4000);
        })
        .catch(err => {
          clearTimeout(to);
          if (triesLeft > 1) {
            st.innerHTML = '网络有点慢，正在自动重试…（第 ' + (4 - triesLeft) + ' 次）';
            setTimeout(() => attempt(triesLeft - 1), 2500);
          } else {
            st.innerHTML = '<b>提交没成功</b><div style="font-size:13px;color:var(--sub);margin:6px 0 10px">点下面按钮重试，或把答案复制给顾问。</div>' +
              '<button class="cta" id="retryBtn" style="width:100%;border:none;border-radius:14px;padding:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;font-family:inherit">再试一次</button>';
            document.getElementById('retryBtn').onclick = () => send(phoneNo, email);
            $('#fallback').style.display = 'flex'; $('#out').style.display = 'block';
          }
        });
    };
    attempt(3);
  };

  if (!location.protocol.startsWith('http')) {
    st.textContent = '请把下面这段答案复制发给顾问（或下载文件）。';
    $('#fallback').style.display = 'flex'; $('#out').style.display = 'block';
    return;
  }
  if (!/^1\d{10}$/.test(phone)) {
    // 老版本答完的情况：在这里补手机号再提交
    st.innerHTML = `<b>还差一步</b>
      <div style="font-size:14px;color:var(--sub);margin:4px 0 10px">请填一个手机号，用于交付报告</div>
      <input id="ph2" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号"
        style="width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px;letter-spacing:1px;font-family:inherit">
      <div style="font-size:14px;color:var(--sub);margin:14px 0 6px">邮箱（可选）：报告生成后会发到这里，你可以先关掉页面</div>
      <input id="em2" type="email" placeholder="name@example.com"
        style="width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;font-family:inherit">
      <button class="cta" id="go2" style="margin-top:12px;width:100%;border:none;border-radius:14px;padding:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;font-family:inherit">提交</button>`;
    $('#go2').onclick = () => {
      const v = ($('#ph2').value || '').replace(/\D/g, '');
      if (!/^1\d{10}$/.test(v)) { alert('请输入 11 位手机号'); return; }
      st.textContent = '正在提交…';
      send(v, ($('#em2').value || '').trim());
    };
    return;
  }

  // 常规情况：手机号已有，直接提交（邮箱已在最后一题里填过）
  send(phone, (state.answers['P7'] || '').trim());
}

function cover(){
  const M = DATA.meta || {};
  const n = (DATA.questions || []).length;
  load();
  const answered = Object.keys(state.answers || {}).length;
  const savedIdx = parseInt(localStorage.getItem('lt_idx') || '-1', 10);
  const resumeAt = Math.max(1, Math.min(n, savedIdx + 1));
  $('#hdr').style.display='none'; $('#ftr').style.display='none';
  $('#main').style.padding = '0';
  $('#main').innerHTML = `<div class="hero">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="inner">
    <div class="k">CAREER × PASSION</div>
    <h1>找到你<br><em>擅长</em>且<em>喜欢</em><br>的事情</h1>
    <p class="lead">${esc(M.line1 || (n + ' 道题，约 15 分钟。'))}<br>
      不是性格测试，是给你一份能落地的方向。</p>
    <div class="feat">
      <div class="row"><div class="ic">01</div><div><b>3 个你天生擅长的事</b>
        <span>不是技能，是你做起来不费劲的那部分</span></div></div>
      <div class="row"><div class="ic">02</div><div><b>2 个值得深耕的行业</b>
        <span>从 100 个行业里，三轮筛出来</span></div></div>
      <div class="row"><div class="ic">03</div><div><b>岗位 + 生意方向</b>
        <span>具体到门槛、代价和 90 天第一步</span></div></div>
    </div>
    ${answered > 0
      ? `<button class="cta" id="go">继续上次 · 第 ${resumeAt} 题<small>已答 ${answered} 题，不会丢</small></button>
         <button class="alt" id="fresh">重新开始</button>`
      : `<button class="cta" id="go">开始测试 · 约 15 分钟<small>做完立刻看到你的方向</small></button>
         <button class="alt" id="demo">先用样例看看报告长什么样</button>`}
    <div class="trustline">${esc(M.note || '不是心理测试 · 不出诊断 · 不承诺结果')}</div>
    </div>
  </div>`;
  $('#go').onclick = () => start(answered > 0);
  const fr = $('#fresh');
  if (fr) fr.onclick = () => { state.answers = {}; state.idx = 0; clearSaved(); start(false); };
  const dm = $('#demo');
  if (dm) dm.onclick = ()=>{ state.answers = DEMO; state.idx = DATA.questions.length; done(); };
}

const DEMO = {
  "Q1":"B","Q2":"A","Q3":"D","Q4":"A","Q5":"B","Q6":"D",
  "Q7":5,"Q8":4,"Q9":3,"Q10":4,"Q11":3,"Q12":2,"Q13":5,"Q14":4,"Q15":3,"Q16":3,"Q17":2,"Q18":4,
  "Q19":"A","Q20":"A","Q21":"A","Q22":"A",
  "Q23":["1","2","3","4"],"Q24":["1","2","3","4"],"Q25":["1","2","3","4"],"Q26":["1","2","3","4"],
  "Q27":["1","2","3"],"Q28":[],"Q29":[],"Q30":["1"],
  "Q31":3,"Q32":4,"Q33":5,"Q34":1,"Q35":2,"Q36":2,"Q37":1,"Q38":1,"Q39":3,
  "Q40":"给一个乱成一团的运营数据，两天内理成能看懂的看板，做完很爽。",
  "Q41":"朋友都说找我看简历、帮我梳理职业方向。",
  "Q42":"做一个帮人看清自己的产品。",
  "C1":"B","C2":2,"C3":4
};

$('#prev').onclick = ()=>{ if(state.idx>0){ state.idx--; save(); render(); } };
$('#next').onclick = ()=>{
  const q = DATA.questions[state.idx];
  if (q && q.type === 'tel' && String(state.answers[q.id] || '').length !== 11) {
    alert('请输入 11 位手机号'); return;
  }
  if (q && q.type === 'multi' && q.dynamic && !(state.answers[q.id] || []).length) {
    alert('这一题至少要选 1 个'); return;
  }
  if (q && q.type === 'date') {
    const v = String(state.answers[q.id] || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { alert('生日按 1984-11-16 这样填'); return; }
    const [y, m, dd] = v.split('-').map(Number);
    if (y < 1900 || y > 2020 || m < 1 || m > 12 || dd < 1 || dd > 31) {
      alert('日期看起来不对，检查一下'); return;
    }
  }
  state.idx++; save(); render();
};

const _p = new URLSearchParams(location.search);
if(_p.has('q')){
  load();
  state.idx = Math.max(0, Math.min(DATA.questions.length-1, parseInt(_p.get('q'),10)-1 || 0));
  $('#hdr').style.display='block'; $('#ftr').style.display='flex';
  render();
}else{
  cover();
}

// 上次提交如果没确认（关得太快），打开页面时自动补交一次
function retryPending(){
  try{
    const raw = localStorage.getItem('lt_pending');
    if(!raw) return;
    const p = JSON.parse(raw);
    if(!p || !p.sid || Date.now() - (p.ts||0) > 12*3600*1000){ localStorage.removeItem('lt_pending'); return; }
    fetch('/api/submit', {method:'POST', headers:{'Content-Type':'application/json'}, keepalive:true,
      body: JSON.stringify({phone:p.phone, email:p.email||'', sid:p.sid, answers:p.answers})})
      .then(r=>r.json())
      .then(j=>{
        if(j && j.ok){
          localStorage.removeItem('lt_pending');
          localStorage.removeItem('lt_sid');
          localStorage.removeItem('lt_answers');
          localStorage.removeItem('lt_idx');
          const d=document.createElement('div');
          d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#2f5d50;color:#fff;padding:12px 16px;font-size:14px;z-index:99;text-align:center';
          d.textContent='上次的答卷已补交成功（编号 '+j.id+'），报告生成后会发你邮箱。';
          document.body.appendChild(d);
          setTimeout(()=>d.remove(), 12000);
        }
      }).catch(()=>{});
  }catch(e){}
}
retryPending();
</script>
