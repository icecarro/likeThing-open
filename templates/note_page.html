<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  .page{width:1080px;height:1440px;background:#fbf8f2;position:relative;overflow:hidden;
        font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#1c1a17}
  .kicker{position:absolute;left:80px;top:84px;font-size:26px;letter-spacing:.28em;color:#b8552f}
  h1{position:absolute;left:80px;top:170px;width:900px;font-size:74px;line-height:1.28;font-weight:900;letter-spacing:-1px;white-space:pre-line}
  h1 em{font-style:normal;color:#b8552f}
  .body{position:absolute;left:80px;top:520px;width:900px;font-size:36px;line-height:1.75;color:#2b2723;white-space:pre-line}
  .body b{color:#b8552f}
  .num{position:absolute;right:60px;bottom:40px;font-size:260px;font-weight:900;color:#f2ece1;line-height:1;letter-spacing:-8px}
  .foot{position:absolute;left:80px;bottom:90px;font-size:26px;color:#6b655c}
  .step{position:absolute;left:80px;top:560px;width:920px;font-size:34px;line-height:1.9;color:#2b2723;white-space:pre-line}
  .step b{color:#b8552f}
  .box{position:absolute;left:80px;top:520px;width:920px;border-left:4px solid #c9a227;padding-left:28px;font-size:34px;line-height:1.8;color:#3a332b;white-space:pre-line}
  .cta{position:absolute;left:80px;top:560px;width:920px;font-size:40px;line-height:1.9;color:#2b2723;white-space:pre-line}
  .cta b{color:#b8552f}
</style></head><body>
<div class="page">
  <div class="kicker">__KICKER__</div>
  <h1>__TITLE__</h1>
  __BODY__
  <div class="num">__NUM__</div>
  <div class="foot">__FOOT__</div>
</div>
</body></html>
