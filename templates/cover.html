<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  .cover{width:1080px;height:1440px;background:#fbf8f2;position:relative;overflow:hidden;
         font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#1c1a17}
  .top{padding:90px 80px 0}
  .kicker{font-size:26px;letter-spacing:.32em;color:#b8552f}
  h1{font-size:96px;line-height:1.22;font-weight:900;letter-spacing:-2px;margin:46px 0 0;white-space:pre-line}
  h1 em{font-style:normal;color:#b8552f}
  .sub{font-size:38px;color:#6b655c;margin-top:36px;line-height:1.5;white-space:pre-line}
  .line{position:absolute;left:80px;right:80px;bottom:300px;height:1px;background:#e6ded2}
  .foot{position:absolute;left:80px;right:80px;bottom:120px;font-size:28px;color:#6b655c;line-height:1.6}
  .tag{position:absolute;right:80px;top:90px;font-size:24px;color:#8a6420;background:#fdf3e3;border-radius:99px;padding:8px 20px}
  .big{position:absolute;right:70px;bottom:60px;font-size:300px;font-weight:900;color:#f4efe6;line-height:1;letter-spacing:-6px}
</style></head><body>
<div class="cover">
  <div class="top">
    <div class="kicker">__KICKER__</div>
    <h1>__TITLE__</h1>
    <div class="sub">__SUB__</div>
  </div>
  <div class="big">__BIG__</div>
  <div class="line"></div>
  <div class="foot">__FOOT__</div>
  <div class="tag">__TAG__</div>
</div>
</body></html>
